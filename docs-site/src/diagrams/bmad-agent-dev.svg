<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" width="940" height="744" viewBox="0 0 940 744" role="img" aria-labelledby="ad-title ad-desc">
  <title id="ad-title">Amelia, Senior Software Engineer: what each menu skill reads, writes and hands on</title>
  <desc id="ad-desc">Amelia, Senior Software Engineer, bmad-agent-dev. SP bmad-sprint-planning reads plan/epics.md, after a PASS gate; writes impl/sprint-status.yaml; next BD build. BD bmad-build reads story or request, epics, planning docs (optional), sprint-status.yaml (optional); writes impl/spec-{slug}.md impl/epic-{N}-context.md impl/deferred-work.md code · status: review; next CR code review, QA tests. QA bmad-qa-generate-e2e-tests reads a built feature; writes tests/api/ · tests/e2e/ impl/tests/ test-summary.md; next CR code review. CR bmad-code-review reads the diff, story file (optional), sprint-status.yaml (optional); writes findings in the story impl/deferred-work.md status: done; next BD next story, ER epic done. ER bmad-retrospective reads epic stories, diff, sprint-status.yaml, previous retro (optional); writes impl/epic-{N}- retro-{date}.md action items; next SP next epic, CC correct course.</desc>
  <defs>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <g fill="var(--dg-ink)">
    <text x="470" y="40" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1" data-i18n="heading">AMELIA, SENIOR SOFTWARE ENGINEER</text>
    <text x="470" y="64" font-size="14" text-anchor="middle" data-i18n="subtitle">Runs the implementation loop: plan the sprint, build each story, review, close the epic.</text>
    <g class="agent-dev" transform="translate(20 88)">
