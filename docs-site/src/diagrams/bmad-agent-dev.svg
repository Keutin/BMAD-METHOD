      <text x="494" y="333.0" class="sub mono" data-i18n="bd-writes-impl-deferred-work-md">impl/deferred-work.md</text>
      <text x="494" y="351.0" font-size="12" data-i18n="bd-writes-code-status-review">code · status: review</text>
      <rect class="node" x="778" y="270" width="142" height="100" rx="2"/>
      <g class="agent-dev"><circle class="swatch" cx="798" cy="308.0" r="8"/><text class="badge" x="798" y="311.5">A</text></g>
      <text x="812" y="312.0" font-size="12" data-i18n="bd-next-cr-code-review">CR code review</text>
      <g class="agent-dev"><circle class="swatch" cx="798" cy="332.0" r="8"/><text class="badge" x="798" y="335.5">A</text></g>
      <text x="812" y="336.0" font-size="12" data-i18n="bd-next-qa-tests">QA tests</text>
