      <text x="228" y="437.0" class="mono" font-size="12" font-weight="700" data-i18n="qa-skill-bmad-qa-generate-e2e-tests">bmad-qa-generate-e2e-tests</text>
      <text x="228" y="455.0" class="sub" data-i18n="qa-purpose">API and E2E tests</text>
