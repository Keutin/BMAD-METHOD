      <text x="32" y="227.0" font-size="12" data-i18n="sp-reads-after-a-pass-gate">after a PASS gate</text>
      <rect class="node hot tone" x="216" y="172" width="240" height="84" rx="2"/>
      <rect class="code-chip" x="228" y="183.0" width="32" height="22" rx="2"/>
      <text x="244.0" y="198.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-sp-sp">SP</text>
      <text x="228" y="225.0" class="mono" font-size="12" font-weight="700" data-i18n="sp-skill-bmad-sprint-planning">bmad-sprint-planning</text>
      <text x="228" y="243.0" class="sub" data-i18n="sp-purpose">generate the sprint plan</text>
      <rect class="node tone" x="482" y="172" width="270" height="84" rx="2"/>
      <text x="494" y="218.0" class="mono" font-size="12" data-i18n="sp-writes-impl-sprint-status-yaml">impl/sprint-status.yaml</text>
      <rect class="node" x="778" y="172" width="142" height="84" rx="2"/>
      <g class="agent-dev"><circle class="swatch" cx="798" cy="214.0" r="8"/><text class="badge" x="798" y="217.5">A</text></g>
      <text x="812" y="218.0" font-size="12" data-i18n="sp-next-bd-build">BD build</text>
