      <text class="badge" x="34" y="26">A</text>
      <text x="52" y="27" font-size="16" font-weight="700" data-i18n="name">Amelia</text>
      <text x="128" y="27" class="sub" data-i18n="title">Senior Software Engineer</text>
      <text x="888" y="27" class="sub mono" text-anchor="end" data-i18n="skill-id">bmad-agent-dev</text>
    </g>
    <text x="22" y="160" class="k" data-i18n="col-reads">READS</text>
    <text x="218" y="160" class="k" data-i18n="col-skill">SKILL</text>
    <text x="484" y="160" class="k" data-i18n="col-writes">WRITES</text>
    <text x="780" y="160" class="k" data-i18n="col-next">NEXT</text>
