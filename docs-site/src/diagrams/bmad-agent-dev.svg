      <text x="494" y="412.0" class="mono" font-size="12" data-i18n="qa-writes-tests-api-tests-e2e">tests/api/ · tests/e2e/</text>
      <text x="494" y="430.0" class="mono" font-size="12" data-i18n="qa-writes-impl-tests">impl/tests/</text>
      <text x="506" y="448.0" class="mono" font-size="12" data-i18n="qa-writes-test-summary-md">test-summary.md</text>
      <rect class="node" x="778" y="384" width="142" height="84" rx="2"/>
      <g class="agent-dev"><circle class="swatch" cx="798" cy="426.0" r="8"/><text class="badge" x="798" y="429.5">A</text></g>
      <text x="812" y="430.0" font-size="12" data-i18n="qa-next-cr-code-review">CR code review</text>
      <path class="edge" d="M190 426.0 H214" marker-end="url(#ad-arrow)"/>
      <path class="edge" d="M456 426.0 H480" marker-end="url(#ad-arrow)"/>
      <path class="edge" d="M752 426.0 H776" marker-end="url(#ad-arrow)"/>
    </g>
    <!-- CR bmad-code-review -->
