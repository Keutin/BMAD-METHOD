      <text x="32" y="608.0" font-size="12" data-i18n="er-reads-epic-stories-diff">epic stories, diff</text>
      <text x="32" y="626.0" font-size="12" data-i18n="er-reads-sprint-status-yaml">sprint-status.yaml</text>
      <text x="32" y="644.0" class="sub" data-i18n="er-reads-previous-retro">previous retro</text>
      <rect class="node hot tone" x="216" y="580" width="240" height="84" rx="2"/>
      <rect class="code-chip" x="228" y="591.0" width="32" height="22" rx="2"/>
