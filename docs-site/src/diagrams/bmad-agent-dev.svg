      <rect class="code-chip" x="228" y="289.0" width="32" height="22" rx="2"/>
      <text x="244.0" y="304.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-bd-bd">BD</text>
      <text x="228" y="331.0" class="mono" font-size="12" font-weight="700" data-i18n="bd-skill-bmad-build">bmad-build</text>
      <text x="228" y="349.0" class="sub" data-i18n="bd-purpose">feature, fix or story</text>
