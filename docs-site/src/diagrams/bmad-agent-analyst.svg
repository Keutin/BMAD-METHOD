<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" width="940" height="744" viewBox="0 0 940 744" role="img" aria-labelledby="aa-title aa-desc">
  <title id="aa-title">Mary, Business Analyst: what each menu skill reads, writes and hands on</title>
  <desc id="aa-desc">Mary, Business Analyst, bmad-agent-analyst. BP bmad-brainstorming reads topic or problem, your ideas; writes out/brainstorming/ brainstorm.html brainstorm-intent.md; next CB product brief, PRD. MR DR TR TS CR UV bmad-deep-recon reads topic or question, brief or PRD (optional); writes plan/research/ {type}-{topic}-{date}/ research.md; next CB product brief, PRD, CA architecture. CB bmad-product-brief reads brainstorms (optional), research (optional), your notes; writes plan/briefs/ brief-{project}-{date}/ brief.md · addendum.md; next PRD. WB bmad-prfaq reads concept, your docs, web research (optional); writes plan/prfaq-{project}.md; next PRD. PC bmad-project-context reads the repository, existing AGENTS.md (optional); writes AGENTS.md context block at the project root; next every agent, BD build.</desc>
  <defs>
    <marker id="aa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <g fill="var(--dg-ink)">
