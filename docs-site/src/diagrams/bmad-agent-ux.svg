<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" width="940" height="372" viewBox="0 0 940 372" role="img" aria-labelledby="au-title au-desc">
  <title id="au-title">Sally, UX Designer: what each menu skill reads, writes and hands on</title>
  <desc id="au-desc">Sally, UX Designer, bmad-agent-ux-designer. CU bmad-ux reads product brief (optional), PRD (optional), your direction; writes plan/ux-designs/ ux-{project}-{date}/ DESIGN.md EXPERIENCE.md; next CA architecture, CE epics.</desc>
  <defs>
    <marker id="au-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <g fill="var(--dg-ink)">
    <text x="470" y="40" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1" data-i18n="heading">SALLY, UX DESIGNER</text>
    <text x="470" y="64" font-size="14" text-anchor="middle" data-i18n="subtitle">Captures how the product looks and behaves, before the architecture fixes it in place.</text>
    <g class="agent-ux" transform="translate(20 88)">
      <rect class="node tone" width="900" height="44" rx="2"/>
      <rect class="swatch" width="6" height="44"/>
      <circle class="swatch" cx="34" cy="22" r="9"/>
      <text class="badge" x="34" y="26">S</text>
      <text x="52" y="27" font-size="16" font-weight="700" data-i18n="name">Sally</text>
      <text x="117" y="27" class="sub" data-i18n="title">UX Designer</text>
      <text x="888" y="27" class="sub mono" text-anchor="end" data-i18n="skill-id">bmad-agent-ux-designer</text>
    </g>
    <text x="22" y="160" class="k" data-i18n="col-reads">READS</text>
    <text x="218" y="160" class="k" data-i18n="col-skill">SKILL</text>
    <text x="484" y="160" class="k" data-i18n="col-writes">WRITES</text>
    <text x="780" y="160" class="k" data-i18n="col-next">NEXT</text>
    <!-- CU bmad-ux -->
    <g class="agent-ux">
      <rect class="node" x="20" y="172" width="170" height="100" rx="2"/>
      <text x="32" y="208.0" class="sub" data-i18n="cu-reads-product-brief">product brief</text>
      <text x="32" y="226.0" class="sub" data-i18n="cu-reads-prd">PRD</text>
      <text x="32" y="244.0" font-size="12" data-i18n="cu-reads-your-direction">your direction</text>
      <rect class="node hot tone" x="216" y="172" width="240" height="100" rx="2"/>
      <rect class="code-chip" x="228" y="191.0" width="32" height="22" rx="2"/>
      <text x="244.0" y="206.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-cu-cu">CU</text>
      <text x="228" y="233.0" class="mono" font-size="12" font-weight="700" data-i18n="cu-skill-bmad-ux">bmad-ux</text>
      <text x="228" y="251.0" class="sub" data-i18n="cu-purpose">UX design</text>
      <rect class="node tone" x="482" y="172" width="270" height="100" rx="2"/>
      <text x="494" y="199.0" class="mono" font-size="12" data-i18n="cu-writes-plan-ux-designs">plan/ux-designs/</text>
      <text x="506" y="217.0" class="mono" font-size="12" data-i18n="cu-writes-ux-project-date">ux-{project}-{date}/</text>
      <text x="506" y="235.0" class="mono" font-size="12" data-i18n="cu-writes-design-md">DESIGN.md</text>
      <text x="506" y="253.0" class="mono" font-size="12" data-i18n="cu-writes-experience-md">EXPERIENCE.md</text>
      <rect class="node" x="778" y="172" width="142" height="100" rx="2"/>
      <g class="agent-architect"><circle class="swatch" cx="798" cy="210.0" r="8"/><text class="badge" x="798" y="213.5">W</text></g>
      <text x="812" y="214.0" font-size="12" data-i18n="cu-next-ca-architecture">CA architecture</text>
      <g class="agent-pm"><circle class="swatch" cx="798" cy="234.0" r="8"/><text class="badge" x="798" y="237.5">J</text></g>
      <text x="812" y="238.0" font-size="12" data-i18n="cu-next-ce-epics">CE epics</text>
      <path class="edge" d="M190 222.0 H214" marker-end="url(#au-arrow)"/>
      <path class="edge" d="M456 222.0 H480" marker-end="url(#au-arrow)"/>
      <path class="edge" d="M752 222.0 H776" marker-end="url(#au-arrow)"/>
    </g>
    <path class="edge lens" d="M20 294 H920"/>
    <text x="20" y="316" class="sub" data-i18n="note">bmad-ux can lead the PRD, follow it, or stand alone: it reads whatever planning artifacts you confirm.</text>
    <text x="20" y="336" class="sub" data-i18n="legend-optional">Grey lines are optional or conditional; a dashed arrow means every input is optional.</text>
    <text x="20" y="354" class="sub mono" data-i18n="legend-paths">plan/ = _bmad-output/planning-artifacts/   impl/ = _bmad-output/implementation-artifacts/   out/ = _bmad-output/</text>
  </g>
</svg>
