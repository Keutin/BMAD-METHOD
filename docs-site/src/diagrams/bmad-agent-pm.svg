<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" width="940" height="662" viewBox="0 0 940 662" role="img" aria-labelledby="ap-title ap-desc">
  <title id="ap-title">John, Product Manager: what each menu skill reads, writes and hands on</title>
  <desc id="ap-desc">John, Product Manager, bmad-agent-pm. PRD bmad-prd reads product brief (optional), research (optional), PRFAQ (optional); writes plan/prds/ prd-{project}-{date}/ prd.md · addendum.md; next CU UX design, CA architecture, CE epics. CE bmad-create-epics-and-stories reads PRD, architecture, UX design (optional); writes plan/epics.md; next IR readiness gate. IR bmad-sprint-planning reads planning artifacts, epics.md; writes PASS · CONCERNS · FAIL plan/implementation- readiness.md on FAIL; next SP sprint plan, CC on FAIL. CC bmad-correct-course reads PRD, epics.md, architecture, UX (optional), the trigger; writes plan/sprint-change- proposal-{date}.md; next PRD or CE, CA architecture, SP sprint plan.</desc>
  <defs>
    <marker id="ap-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <g fill="var(--dg-ink)">
    <text x="470" y="40" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1" data-i18n="heading">JOHN, PRODUCT MANAGER</text>
    <text x="470" y="64" font-size="14" text-anchor="middle" data-i18n="subtitle">Owns the requirements, breaks them into epics, and steers the plan when it changes.</text>
    <g class="agent-pm" transform="translate(20 88)">
      <rect class="node tone" width="900" height="44" rx="2"/>
      <rect class="swatch" width="6" height="44"/>
      <circle class="swatch" cx="34" cy="22" r="9"/>
      <text class="badge" x="34" y="26">J</text>
      <text x="52" y="27" font-size="16" font-weight="700" data-i18n="name">John</text>
      <text x="106" y="27" class="sub" data-i18n="title">Product Manager</text>
      <text x="888" y="27" class="sub mono" text-anchor="end" data-i18n="skill-id">bmad-agent-pm</text>
    </g>
    <text x="22" y="160" class="k" data-i18n="col-reads">READS</text>
    <text x="218" y="160" class="k" data-i18n="col-skill">SKILL</text>
    <text x="484" y="160" class="k" data-i18n="col-writes">WRITES</text>
    <text x="780" y="160" class="k" data-i18n="col-next">NEXT</text>
    <!-- PRD bmad-prd -->
    <g class="agent-pm">
      <rect class="node" x="20" y="172" width="170" height="100" rx="2"/>
      <text x="32" y="208.0" class="sub" data-i18n="prd-reads-product-brief">product brief</text>
      <text x="32" y="226.0" class="sub" data-i18n="prd-reads-research">research</text>
      <text x="32" y="244.0" class="sub" data-i18n="prd-reads-prfaq">PRFAQ</text>
      <rect class="node hot tone" x="216" y="172" width="240" height="100" rx="2"/>
      <rect class="code-chip" x="228" y="191.0" width="41" height="22" rx="2"/>
      <text x="248.5" y="206.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-prd-prd">PRD</text>
      <text x="228" y="233.0" class="mono" font-size="12" font-weight="700" data-i18n="prd-skill-bmad-prd">bmad-prd</text>
      <text x="228" y="251.0" class="sub" data-i18n="prd-purpose">create, update, validate</text>
      <rect class="node tone" x="482" y="172" width="270" height="100" rx="2"/>
      <text x="494" y="208.0" class="mono" font-size="12" data-i18n="prd-writes-plan-prds">plan/prds/</text>
      <text x="506" y="226.0" class="mono" font-size="12" data-i18n="prd-writes-prd-project-date">prd-{project}-{date}/</text>
      <text x="506" y="244.0" class="mono" font-size="12" data-i18n="prd-writes-prd-md-addendum-md">prd.md · addendum.md</text>
      <rect class="node" x="778" y="172" width="142" height="100" rx="2"/>
      <g class="agent-ux"><circle class="swatch" cx="798" cy="198.0" r="8"/><text class="badge" x="798" y="201.5">S</text></g>
      <text x="812" y="202.0" font-size="12" data-i18n="prd-next-cu-ux-design">CU UX design</text>
      <g class="agent-architect"><circle class="swatch" cx="798" cy="222.0" r="8"/><text class="badge" x="798" y="225.5">W</text></g>
      <text x="812" y="226.0" font-size="12" data-i18n="prd-next-ca-architecture">CA architecture</text>
      <g class="agent-pm"><circle class="swatch" cx="798" cy="246.0" r="8"/><text class="badge" x="798" y="249.5">J</text></g>
      <text x="812" y="250.0" font-size="12" data-i18n="prd-next-ce-epics">CE epics</text>
      <path class="edge soft" d="M190 222.0 H214" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M456 222.0 H480" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M752 222.0 H776" marker-end="url(#ap-arrow)"/>
    </g>
    <!-- CE bmad-create-epics-and-stories -->
    <g class="agent-pm">
      <rect class="node" x="20" y="286" width="170" height="84" rx="2"/>
      <text x="32" y="314.0" font-size="12" data-i18n="ce-reads-prd">PRD</text>
      <text x="32" y="332.0" font-size="12" data-i18n="ce-reads-architecture">architecture</text>
      <text x="32" y="350.0" class="sub" data-i18n="ce-reads-ux-design">UX design</text>
      <rect class="node hot tone" x="216" y="286" width="240" height="84" rx="2"/>
      <rect class="code-chip" x="228" y="297.0" width="32" height="22" rx="2"/>
      <text x="244.0" y="312.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-ce-ce">CE</text>
      <text x="228" y="339.0" class="mono" font-size="12" font-weight="700" data-i18n="ce-skill-bmad-create-epics-and-stories">bmad-create-epics-and-stories</text>
      <text x="228" y="357.0" class="sub" data-i18n="ce-purpose">epics and stories</text>
      <rect class="node tone" x="482" y="286" width="270" height="84" rx="2"/>
      <text x="494" y="332.0" class="mono" font-size="12" data-i18n="ce-writes-plan-epics-md">plan/epics.md</text>
      <rect class="node" x="778" y="286" width="142" height="84" rx="2"/>
      <g class="agent-pm"><circle class="swatch" cx="798" cy="328.0" r="8"/><text class="badge" x="798" y="331.5">J</text></g>
      <text x="812" y="332.0" font-size="12" data-i18n="ce-next-ir-readiness-gate">IR readiness gate</text>
      <path class="edge" d="M190 328.0 H214" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M456 328.0 H480" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M752 328.0 H776" marker-end="url(#ap-arrow)"/>
    </g>
    <!-- IR bmad-sprint-planning -->
    <g class="agent-pm">
      <rect class="node" x="20" y="384" width="170" height="84" rx="2"/>
      <text x="32" y="421.0" font-size="12" data-i18n="ir-reads-planning-artifacts">planning artifacts</text>
      <text x="32" y="439.0" font-size="12" data-i18n="ir-reads-epics-md">epics.md</text>
      <rect class="node hot tone" x="216" y="384" width="240" height="84" rx="2"/>
      <rect class="code-chip" x="228" y="395.0" width="32" height="22" rx="2"/>
      <text x="244.0" y="410.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-ir-ir">IR</text>
      <text x="228" y="437.0" class="mono" font-size="12" font-weight="700" data-i18n="ir-skill-bmad-sprint-planning">bmad-sprint-planning</text>
      <text x="228" y="455.0" class="sub" data-i18n="ir-purpose">readiness gate only</text>
      <rect class="node tone" x="482" y="384" width="270" height="84" rx="2"/>
      <text x="494" y="412.0" font-size="12" data-i18n="ir-writes-pass-concerns-fail">PASS · CONCERNS · FAIL</text>
      <text x="494" y="430.0" class="sub mono" data-i18n="ir-writes-plan-implementation">plan/implementation-</text>
      <text x="506" y="448.0" class="sub mono" data-i18n="ir-writes-readiness-md-on-fail">readiness.md on FAIL</text>
      <rect class="node" x="778" y="384" width="142" height="84" rx="2"/>
      <g class="agent-dev"><circle class="swatch" cx="798" cy="414.0" r="8"/><text class="badge" x="798" y="417.5">A</text></g>
      <text x="812" y="418.0" font-size="12" data-i18n="ir-next-sp-sprint-plan">SP sprint plan</text>
      <g class="agent-pm"><circle class="swatch" cx="798" cy="438.0" r="8"/><text class="badge" x="798" y="441.5">J</text></g>
      <text x="812" y="442.0" font-size="12" data-i18n="ir-next-cc-on-fail">CC on FAIL</text>
      <path class="edge" d="M190 426.0 H214" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M456 426.0 H480" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M752 426.0 H776" marker-end="url(#ap-arrow)"/>
    </g>
    <!-- CC bmad-correct-course -->
    <g class="agent-pm">
      <rect class="node" x="20" y="482" width="170" height="100" rx="2"/>
      <text x="32" y="518.0" font-size="12" data-i18n="cc-reads-prd-epics-md">PRD, epics.md</text>
      <text x="32" y="536.0" class="sub" data-i18n="cc-reads-architecture-ux">architecture, UX</text>
      <text x="32" y="554.0" font-size="12" data-i18n="cc-reads-the-trigger">the trigger</text>
      <rect class="node hot tone" x="216" y="482" width="240" height="100" rx="2"/>
      <rect class="code-chip" x="228" y="501.0" width="32" height="22" rx="2"/>
      <text x="244.0" y="516.0" class="mono" font-size="12" font-weight="700" text-anchor="middle" data-i18n="code-cc-cc">CC</text>
      <text x="228" y="543.0" class="mono" font-size="12" font-weight="700" data-i18n="cc-skill-bmad-correct-course">bmad-correct-course</text>
      <text x="228" y="561.0" class="sub" data-i18n="cc-purpose">significant change mid-sprint</text>
      <rect class="node tone" x="482" y="482" width="270" height="100" rx="2"/>
      <text x="494" y="527.0" class="mono" font-size="12" data-i18n="cc-writes-plan-sprint-change">plan/sprint-change-</text>
      <text x="506" y="545.0" class="mono" font-size="12" data-i18n="cc-writes-proposal-date-md">proposal-{date}.md</text>
      <rect class="node" x="778" y="482" width="142" height="100" rx="2"/>
      <g class="agent-pm"><circle class="swatch" cx="798" cy="508.0" r="8"/><text class="badge" x="798" y="511.5">J</text></g>
      <text x="812" y="512.0" font-size="12" data-i18n="cc-next-prd-or-ce">PRD or CE</text>
      <g class="agent-architect"><circle class="swatch" cx="798" cy="532.0" r="8"/><text class="badge" x="798" y="535.5">W</text></g>
      <text x="812" y="536.0" font-size="12" data-i18n="cc-next-ca-architecture">CA architecture</text>
      <g class="agent-dev"><circle class="swatch" cx="798" cy="556.0" r="8"/><text class="badge" x="798" y="559.5">A</text></g>
      <text x="812" y="560.0" font-size="12" data-i18n="cc-next-sp-sprint-plan">SP sprint plan</text>
      <path class="edge" d="M190 532.0 H214" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M456 532.0 H480" marker-end="url(#ap-arrow)"/>
      <path class="edge" d="M752 532.0 H776" marker-end="url(#ap-arrow)"/>
    </g>
    <path class="edge lens" d="M20 604 H920"/>
    <text x="20" y="626" class="sub" data-i18n="legend-optional">Grey lines are optional or conditional; a dashed arrow means every input is optional.</text>
    <text x="20" y="644" class="sub mono" data-i18n="legend-paths">plan/ = _bmad-output/planning-artifacts/   impl/ = _bmad-output/implementation-artifacts/   out/ = _bmad-output/</text>
  </g>
</svg>
