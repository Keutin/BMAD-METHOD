<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" width="940" height="1016" viewBox="0 0 940 1016" role="img" aria-labelledby="wa-title wa-desc">
  <title id="wa-title">The five BMad Method agents and their menu codes</title>
  <desc id="wa-desc">Each agent has a colour used for its steps in the workflow diagrams. Mary, Business Analyst, bmad-agent-analyst, cyan: BP bmad-brainstorming; MR, DR, TR, CR and UV bmad-deep-recon for market, domain, technical, competitive and user-voice research; TS bmad-deep-recon to choose between technologies; CB bmad-product-brief; WB bmad-prfaq; PC bmad-project-context. John, Product Manager, bmad-agent-pm, green: PRD bmad-prd; CE bmad-create-epics-and-stories; IR bmad-sprint-planning readiness gate; CC bmad-correct-course. Sally, UX Designer, bmad-agent-ux-designer, purple: CU bmad-ux. Winston, System Architect, bmad-agent-architect, orange: CA bmad-architecture; IR bmad-sprint-planning readiness gate. Amelia, Senior Software Engineer, bmad-agent-dev, indigo: BD bmad-build; QA bmad-qa-generate-e2e-tests; CR bmad-code-review; SP bmad-sprint-planning; ER bmad-retrospective. No agent: bmad, bmad-forge-idea, bmad-spec, bmad-build-auto, bmad-walkthrough, bmad-review, bmad-party-mode, bmad-advanced-elicitation, bmad-customize. Agents are optional; every skill also runs on its own, and codes are scoped to their agent.</desc>

